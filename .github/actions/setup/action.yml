name: Setup project

description: Checkout the repository and install Node dependencies

inputs:
  install:
    description: Whether to install dependencies
    required: false
    default: true

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup pnpm
      uses: pnpm/setup@v2
      with:
        cache: true
        install: ${{ inputs.install }}
